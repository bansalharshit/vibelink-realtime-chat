<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>VibeLink – Chat App </title>

    <!-- Bootstrap CSS via WebJars -->
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<div class="container py-5">

    <h2 class="text-center mb-4">💬 VibeLink Chat</h2>

    <!-- Screen 1: Login -->
    <div id="login-screen">
        <div class="mb-3">
            <input type="text" id="username" class="form-control" placeholder="Enter your name" autocomplete="off" required />
        </div>
        <button class="btn btn-primary w-100" onclick="proceedToRooms()">Continue</button>
    </div>

    <!-- Screen 2: Room Selection -->
    <div id="room-screen" style="display:none;">
        <h4 class="mb-3">Select or Create a Room</h4>
        <select id="roomSelect" class="form-select mb-2"></select>
        <input type="text" id="newRoom" class="form-control mb-2" placeholder="Or create new room" autocomplete="off" />
        <button class="btn btn-success w-100" onclick="joinSelectedRoom()">Join Room</button>
    </div>

    <!-- Screen 3: Chat -->
    <div id="chat-screen" style="display:none;">
        <div id="chat-box" class="border rounded p-3 mb-3" style="height: 400px; overflow-y: auto;"></div>

        <form id="chat-form" class="d-flex gap-2">
            <input type="text" id="message" class="form-control" placeholder="Type a message..." autocomplete="off" required />
            <button type="submit" class="btn btn-primary">Send</button>
        </form>
        <button class="btn btn-secondary mt-2 w-100" onclick="leaveRoom()">Leave Room</button>
    </div>
</div>


<!-- jQuery (needed for some Bootstrap components) -->
<script src="/webjars/jquery/jquery.min.js"></script>
<!-- Bootstrap JS -->
<script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
<!-- SockJS + STOMP via WebJars -->
<script src="/webjars/sockjs-client/sockjs.min.js"></script>
<script src="/webjars/stomp-websocket/stomp.min.js"></script>

<!-- Your app logic -->
<script src="/script.js"></script>
</body>
</html>
